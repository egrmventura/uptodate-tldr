# uptodate-tldr configuration
# Any value here can be overridden by an environment variable of the same
# name (uppercased). See .env.example for the full list.

topic: "New Claude Code Features"

# Topics for the comparative analysis pipeline (analyze.py).
# Each topic runs a separate source query; results are grouped, analyzed,
# and written into a single daily analysis digest.
topics:
  - "AI Tools"
  - "Data Engineering"
  - "New Codex Features"
  - "AI Memory"

# Product categories for the timeline site (secondbrain/collect.py).
# Each category rotates through its queries per collection run; every
# collected record is tagged with its category, which flows through
# consolidation → snapshots → the site's category tabs.
categories:
  "Data Engineering":
    queries:
      - "data engineering"
      - "dbt"
      - "data pipeline"
      - "data warehouse"
      - "spark"
      - "airflow"
      - "iceberg"
  "AI & ML Tools":
    queries:
      - "claude code"
      - "ai coding agent"
      - "mcp server"
      - "copilot"
      - "cursor ai"
      - "llm tooling"
  "LLM Platforms":
    queries:
      - "anthropic"
      - "openai release"
      - "gemini"
      - "llama model"
      - "claude api"
  "AI Memory & Agents":
    queries:
      - "ai memory"
      - "agent memory"
      - "rag retrieval"
      - "vector database"
      - "embeddings"

# Number of items to summarize in the final digest (2-6)
top_n: 4

sources:
  hackernews:
    enabled: true
    # Algolia HN search endpoint, max stories to pull before ranking
    max_results: 30
  arxiv:
    enabled: true
    # arXiv category to scope the search, e.g. cs.AI, cs.LG
    category: "cs.SE"
    max_results: 20
  linkedin:
    enabled: false
    # See sources/linkedin.py for the fragility tradeoffs of this source.
    max_results: 15
  rss:
    # Curated "reputable resources" feeds for the timeline product. A feed is
    # its own curation, so the topic query does not apply. Bad/moved feeds are
    # isolated by the source (log + skip).
    enabled: true
    feeds:
      - "https://aws.amazon.com/blogs/big-data/feed/"
      - "https://huggingface.co/blog/feed.xml"
      - "https://simonwillison.net/atom/everything/"
      - "https://www.databricks.com/feed"
    max_results: 20

# Optional full-text enrichment: after sources return items, fetch each item's
# URL and attach the scraped article body (see scraper.py). Best-effort — a
# blocked/paywalled/failed fetch leaves the item's existing excerpt intact.
# Off by default; enabling it adds a network fetch per item.
scraping:
  enabled: false
  min_body_chars: 200
  timeout: 10
  max_workers: 8

ranking:
  # Half-life (in hours) used for the recency-weighting decay function.
  recency_half_life_hours: 24
  # Multiplier applied to an item's score when the same story (by URL/title
  # similarity) appears across 2+ sources.
  cross_source_bonus: 1.5
  # Weight applied to an arXiv item's citation count when computing score.
  citation_weight: 2.0

persona:
  prompt: >
    You are a sharp, no-nonsense technical analyst writing a daily digest for
    senior engineers and researchers. Be direct, skip the filler, and call
    out when something is overhyped or genuinely significant. Assume the
    reader is technically fluent.

llm:
  model: "claude-sonnet-4-6"
  max_tokens: 2000

delivery:
  markdown:
    enabled: true
    output_dir: "./output"
  analysis_md:
    enabled: true
    output_dir: "./output"
  email:
    enabled: false
    to: ""
    from: ""
  substack:
    enabled: false
    publication_url: ""

schedule:
  # 24-hour time, local timezone, used by scheduler.py
  daily_time: "07:00"
